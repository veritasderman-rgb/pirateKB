    url: https://www.aktualne.cz/rss/
    aktivni: true
  - nazev: Aktuálně.cz
    domena: aktualne.cz
    url: https://www.aktualne.cz/rss/domaci/
    aktivni: true
    poznamka: rubrika Domácí
  - nazev: iDNES.cz
    domena: idnes.cz
    url: https://servis.idnes.cz/rss.aspx?c=zpravodaj
    aktivni: true
  - nazev: iDNES.cz
    domena: idnes.cz
    url: https://servis.idnes.cz/rss.aspx?c=domaci
    aktivni: true
    poznamka: rubrika Domácí
  - nazev: Deník N
