    url: https://ct24.ceskatelevize.cz/rss/domaci
    aktivni: true
    poznamka: rubrika Domácí
  - nazev: Seznam Zprávy
    domena: seznamzpravy.cz
    url: https://www.seznamzpravy.cz/rss
    aktivni: true
  - nazev: Seznam Zprávy
    domena: seznamzpravy.cz
    url: https://www.seznamzpravy.cz/rss/politika
    aktivni: true
    poznamka: rubrika Politika
  - nazev: Novinky.cz
    domena: novinky.cz
    url: https://www.novinky.cz/rss
    aktivni: true
  - nazev: Novinky.cz
    domena: novinky.cz
    url: https://www.novinky.cz/rss/domaci
    aktivni: true
    poznamka: rubrika Domácí
  - nazev: Aktuálně.cz
