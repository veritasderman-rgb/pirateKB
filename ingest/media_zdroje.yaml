  - nazev: Hospodářské noviny
    domena: hn.cz
    url: https://domaci.hn.cz/?m=rss
    aktivni: true
    poznamka: rubrika Domácí
  - nazev: Echo24
    domena: echo24.cz
    url: https://www.echo24.cz/rss/s
    aktivni: true
    poznamka: echo24.cz/rss vrací 404, funkční kanál je uveden v hlavičce webu
  - nazev: Forum24
