  - forum24\.cz/.*diskuze
  - /diskuze(/|$|\?)
  - /komentare/\d+$

google_news:
  url: https://news.google.com/rss/search
  parametry: {hl: cs, gl: CZ, ceid: "CZ:cs"}
  poznamka: "cca 100 nejnovějších položek na dotaz; s operátory after:/before: jen vzorek 20 až 40 na měsíc"

gdelt:
  url: https://api.gdeltproject.org/api/v2/doc/doc
  poznamka: >-
    ArtList, max 250 záznamů na dotaz, dotaz omezen na sourcelang:czech. Limit 1 požadavek za 5 s
    na IP adresu; při překročení vrací 429 (textově). Indexuje jen část českých médií a nedává perex.
