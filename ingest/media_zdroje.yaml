# Zdroje mediálního monitoringu (ingest/media.py). URL kanálů ověřeny 2026-10-06.
#
# rss:               veřejné RSS kanály českých médií. `aktivni: false` = kanál v době ověření
#                    neexistoval nebo vracel prázdný výstup; skript ho přeskočí (po nalezení
#                    funkční URL ji opravte a nastavte true). `domena` slouží k pojmenování média
#                    i u článků z Google News a GDELT. Kanály dávají jen posledních 20 až 150
#                    položek (Respekt 2000), takže RSS pokrývá jen poslední dny.
# nazvy_medii:       doména -> název média pro zdroje bez vlastního RSS (hledá se i podle
#                    nadřazené domény: ct24.ceskatelevize.cz -> ceskatelevize.cz)
# vyloucene_domeny:  nikdy neukládat (vlastní weby strany pokrývají jiné konektory; agregátory)
# vyloucene_url:     regulární výrazy na URL, které nejsou články (profilové stránky, diskuze pod článkem)
# google_news:       šablona dotazu; GDELT viz gdelt.
rss:
  - nazev: iROZHLAS
    domena: irozhlas.cz
    url: https://www.irozhlas.cz/rss/irozhlas
    aktivni: true
  - nazev: iROZHLAS
    domena: irozhlas.cz
    url: https://www.irozhlas.cz/rss/irozhlas/section/zpravy-domov
    aktivni: true
    poznamka: rubrika Zprávy z domova
  - nazev: ČT24
    domena: ceskatelevize.cz
