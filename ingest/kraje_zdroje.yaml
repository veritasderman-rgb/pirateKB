    poznamka: web z cloudu nedosažitelný (reset spojení)
  pardubicky:
    nazev: Pardubický kraj
    web: https://www.pardubickykraj.cz/
    system: neznamo
    stav: bez-piratu
    poznamka: web dosažitelný
  vysocina:
    nazev: Kraj Vysočina
    web: https://www.kr-vysocina.cz/
    system: neznamo
    stav: bez-piratu
    poznamka: web z cloudu nedosažitelný (prázdná odpověď)
  jihomoravsky:
