# Klíčová slova pro mediální monitoring (ingest/media.py).
#
# Vygenerováno 2026-10-06 z data/psp/poslanci.jsonl (všichni pirátští poslanci, `aktualni: true`
# = člen klubu Piráti v aktuálním období, id klubu 1745) a z data/lide/osoby.jsonl (členové
# Republikového předsednictva), doplněno ručně (europoslankyně, radní). Kurátor může soubor
# upravovat ručně: skript ho nepřepisuje.
#
# Jak doplnit osobu: přidejte položku do `osoby` s poli
#   jmeno      celé jméno (Google News a GDELT hledají přesnou frázi "Jméno Příjmení")
#   prijmeni   příjmení (jen pro čitelnost)
#   kmen       kmen příjmení BEZ diakritiky a malými písmeny jako regulární výraz, tolerantní
#              ke skloňování: "bartos" najde Bartoš, Bartoše, Bartošovi; "richterov" najde
#              Richterová, Richterové, Richterovou; "michale?k" najde Michálek i Michálka;
#              u dvojitých příjmení části oddělte svislítkem ("fercikov|konecn")
#   aktualni   true = současný poslanec / funkcionář (jen informativní pole pro kurátora)
#   role       popis role (jen informativní)
#   jen_s_textem  true u běžných jmen (Martínek, Svobodová, Hoffmannová…): článek se uloží, jen když je
#              jméno nebo strana v titulku/perexu; samotný dotaz na jméno nestačí (jinak se chytají jmenovci)
# Shoda podle samotného příjmení se započítá jen tehdy, když je v titulku nebo perexu zároveň
# zmíněna strana (jinak by "Svobodová" nebo "Hřib" chytaly cizí lidi a houby); shoda celého
# jména platí vždy. U dotazů na jméno (Google News, GDELT) se jméno započítá i bez shody v
# titulku, protože vyhledávač prohledal celý text (pole `shoda: dotaz` v clanky.jsonl).
#
# Jak doplnit klíčové slovo strany: `strana.dotazy` jsou fráze pro vyhledávače (Google News,
# GDELT), `strana.vzory` regulární výrazy pro filtr titulku+perexu (text bez diakritiky, malá
# písmena), `strana.vylouceni` kontexty, ve kterých slovo "piráti" NEZNAMENÁ stranu (sport,
# Somálsko, film, silniční piráti…). Vyloučení ruší jen shodu strany, ne shodu celého jména osoby.

strana:
  dotazy:
  - Piráti
  - Pirátská strana
  - Česká pirátská strana
  - pirátský poslanec
  - pirátská poslankyně
  vzory:
  - \bpirat(i|u|um|ech|y|a|e|ek|ka|ky|ku|kou|kam|kach)\b
  - \bpiratsk\w*
  - \bpiratstrana\b
  vylouceni:
  - somal\w* pirat
  - pirat\w* z karibiku
  - pirati? karibiku
  - pirat\w* silnic
  - silnicn\w* pirat
  - piratstvi
  - pirat\w*\s+(kopi|verz|stahov|software|vysilan|radi|rozhlas|lod|utok|utoc|zaliv|unes)
  - (hokej|extralig|chance lig|florbal|basketbal|fotbal|rugby|ragby|baseball|hazen|play.?off|utkani|zapas\w* sezon|stadion)
  - pirati chomutov
  - chomutovsk\w* pirat
  - pirates
  - piratsk\w* (lod|vlajk\w* nad lod|poklad|hra|kostym|party)

