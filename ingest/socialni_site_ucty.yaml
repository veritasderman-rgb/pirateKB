# Účty pirátských poslanců na sociálních sítích (vstup pro ingest/socialni_site.py).
#
# Soubor je kurátorovaný ručně: skript ho jen čte. Vygenerováno 2026-10-06 z
# data/psp/poslanci.jsonl (klub 1745 = období 2025, 19 poslanců), z pole `socialni_site`
# profilů na pirati.cz (data/pirati-web/lide/*.md) a z vyhledávání
# app.bsky.actor.searchActors / getProfile na public.api.bsky.app.
#
# Pole:
#   jmeno         jméno poslance (bez titulů), jde do `osoba` ve výstupu
#   x             uživatelské jméno na X/Twitteru bez @, nebo null
#   bluesky       handle na Bluesky (např. jmeno.bsky.social), nebo null
#   overit        false = oba účty ověřené; true = žádný z účtů nebyl spolehlivě ověřen;
#                 seznam platforem (např. [bluesky]) = jen tyto účty jsou nejisté (shoda jen
#                 podle jména, prázdný profil apod.). Nejisté účty skript stahuje jen
#                 s přepínačem --i-neoverene.
#   zdroj_odkazu  odkud odkaz pochází (URL profilu na pirati.cz, nebo popis hledání)
#   poznamka      volný text pro kurátora
#
# Pokud poslanec má účet, který tu chybí, doplňte ho a spusťte skript znovu; výstupy
# se slučují podle id příspěvku, nic se nemaže.

