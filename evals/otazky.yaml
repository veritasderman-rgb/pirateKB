# Evals znalostní báze Pirátů: typické otázky uživatelů a co musí odpověď obsahovat.
#
# Spuštění: python3 evals/run.py  (viz evals/run.py a server/README.md, sekce „Zpětná vazba a evals“)
#
# Každá otázka:
#   id               jedinečný identifikátor (prefix = kategorie)
#   kategorie        lide | organy | program | stanoviska | tiskove-zpravy | hlasovani | brand |
#                    sablony | schuzky | systemy | media | socialni-site | projevy
#   otazka           jak by se zeptal člověk (pro čtenáře a reporty)
#   tool, argumenty  který tool MCP serveru má AI zavolat a s čím
#   ocekavane        aspoň jeden z řetězců musí být ve výstupu (bez ohledu na diakritiku a velikost)
#   nesmi_obsahovat  (volitelně) žádný z řetězců nesmí být ve výstupu
#   zdroj_musi_byt   (volitelně) doména (nebo seznam domén), z níž musí být ve výstupu aspoň jedna URL
#
# Pozor: tool v odpovědi často opakuje dotaz („Výsledky hledání „X““, „Žádná tisková zpráva k „X““),
# proto `ocekavane` nesmí být jen slova z argumentů; použij text, který je jen ve správné odpovědi
# (název dokumentu, jméno, e-mail, URL), případně přidej `nesmi_obsahovat` s hláškou „nic nenalezeno“.
#
# Otázky stojí nad skutečnými daty v data/ (stav 2026-10). Když se data změní (nový předseda,
# jiné vedení jednotky), uprav očekávání tady, ne práh v CI.

verze: 1
