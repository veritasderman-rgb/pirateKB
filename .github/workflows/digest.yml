# Týdenní digest „Co se stalo v pirátské politice tento týden“.
#
#   pondělí 05:40 UTC: scripts/digest.py vyrobí docs/digest/<RRRR>-T<TT>.md za minulý týden
#   (pondělí–neděle), obnoví docs/digest/README.md a feed.xml (RSS) a commitne je do main.
#   Volitelně digest pošle do Zulipu (secrets ZULIP_*). Ručně: Actions -> "Týdenní digest"
#   -> Run workflow (lze zadat vlastní období od/do).
#
# Běží až po nedělní (týdenní) aktualizaci dat, takže vychází z úplných dat.
# Práva: stejně jako update-data.yml (Workflow permissions: Read and write).
name: Týdenní digest

on:
  schedule:
    - cron: "40 5 * * 1"   # pondělí
  workflow_dispatch:
    inputs:
      od:
        description: "Začátek období (YYYY-MM-DD, výchozí minulé pondělí)"
        required: false
        default: ""
      do:
        description: "Konec období (YYYY-MM-DD, výchozí minulá neděle)"
        required: false
        default: ""

permissions:
  contents: write

# Nekřížit se s aktualizací dat (oba commitují do main).
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  digest:
    name: Digest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Instalace závislostí
        run: pip install -r server/requirements.txt

      - name: Digest
        id: digest
        env:
          ZULIP_SITE: ${{ secrets.ZULIP_SITE }}
          ZULIP_BOT_EMAIL: ${{ secrets.ZULIP_BOT_EMAIL }}
          ZULIP_API_KEY: ${{ secrets.ZULIP_API_KEY }}
          ZULIP_STREAM: ${{ secrets.ZULIP_STREAM }}
          ZULIP_TOPIC: ${{ secrets.ZULIP_TOPIC }}
          OD: ${{ inputs.od }}
          DO: ${{ inputs.do }}
        run: |
          args=()
          [ -n "$OD" ] && args+=(--od "$OD")
          [ -n "$DO" ] && args+=(--do "$DO")
          soubor=$(python3 scripts/digest.py "${args[@]}" | tail -n 1)
          echo "tyden=$(basename "$soubor" .md)" >> "$GITHUB_OUTPUT"

      - name: Commit a push docs/digest/
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          TYDEN: ${{ steps.digest.outputs.tyden }}
        run: |
          git config user.name "piratekb-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/digest
          if git diff --cached --quiet; then
            echo "Žádné změny v docs/digest/, nic se necommituje."
            exit 0
          fi
          git commit -m "digest: tyden ${TYDEN}"
          for pokus in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            echo "Push se nepodařil (pokus $pokus), zkouším znovu"
            sleep 10
          done
          exit 1
