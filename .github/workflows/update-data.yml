# Automatická aktualizace dat znalostní báze.
#
#   denni   každý den 04:17 UTC: rychlé inkrementy (evidence, media, sociální sítě, nové aktuality, psp)
#   tydenni neděle 03:23 UTC: všechny zdroje (úplný běh)
#   ručně   Actions -> "Aktualizace dat" -> Run workflow (volba režimu)
#
# Změny v data/ se commitnou přímo do main. Každý push do main automaticky spustí build
# na Vercelu (Dockerfile postaví index z data/), nic dalšího se nastavovat nemusí.
# Stav po zdrojích je v data/AKTUALIZACE.md (dostupné i přes MCP server jako dokument).
#
# Nutné jednou nastavit: Settings -> Actions -> General -> Workflow permissions:
# "Read and write permissions" (a pokud je main chráněná větev, povolit botovi push).
name: Aktualizace dat

on:
  schedule:
    - cron: "17 4 * * *"   # denni
    - cron: "23 3 * * 0"   # tydenni (neděle)
  workflow_dispatch:
    inputs:
      rezim:
        description: "Režim aktualizace"
        type: choice
        options: [denni, tydenni]
        default: denni

permissions:
  contents: write

# Dva běhy najednou by si sahaly na stejné soubory a commity; druhý počká na prvního.
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  aktualizace:
    name: Aktualizace (${{ github.event_name == 'workflow_dispatch' && inputs.rezim || (github.event.schedule == '23 3 * * 0' && 'tydenni' || 'denni') }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.rezim || (github.event.schedule == '23 3 * * 0' && 'tydenni' || 'denni') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            ingest/requirements.txt
            server/requirements.txt

      - name: Instalace závislostí
        run: pip install -r ingest/requirements.txt -r server/requirements.txt

      # pdftotext pro měsíční běh frankbold.py (nové PDF publikace); bez něj jen kontrola katalogu.
      - name: poppler-utils (pdftotext)
        continue-on-error: true
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      # Volitelné: headless Chromium pro X/Twitter bez API tokenu (socialni_site.py).
      # Když selže, X se přeskočí a běh pokračuje.
      - name: Playwright a Chromium (volitelné)
        continue-on-error: true
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Datum
        id: datum
        run: echo "dnes=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      # HTTP cache ingestu (.cache/http): už stažené články a zipy se nestahují znovu.
      # Klíč podle data, restore-keys vezme nejnovější starší cache.
      - name: Obnovení HTTP cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/http
          key: http-cache-${{ steps.datum.outputs.dnes }}
          restore-keys: |
            http-cache-

      - name: Aktualizace dat (${{ env.MODE }})
        id: update
        # Skript vrací 0 = OK, 1 = selhal některý zdroj, 2 = selhala validace/build indexu.
        # Kód si uložíme, aby se i po částečném selhání commitly data z ostatních zdrojů.
        run: |
          set +e
          scripts/update_data.sh "$MODE"
          echo "kod=$?" >> "$GITHUB_OUTPUT"
        env:
          # Volitelné klíče; bez nich se příslušný zdroj omezí nebo přeskočí (viz docs/rutiny.md).
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          FLICKR_API_KEY: ${{ secrets.FLICKR_API_KEY }}
          MRAK_USER: ${{ secrets.MRAK_USER }}
          MRAK_APP_PASSWORD: ${{ secrets.MRAK_APP_PASSWORD }}

      - name: Uložení HTTP cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: .cache/http
          key: http-cache-${{ steps.datum.outputs.dnes }}

      # Commit jen na main a jen když se něco změnilo. Při kódu 2 (rozbitá validace nebo index)
      # se nic necommituje, aby se chybná data nedostala do nasazení.
      - name: Commit a push změn v data/
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.update.outputs.kod != '2' }}
        env:
          DNES: ${{ steps.datum.outputs.dnes }}
        run: |
          git config user.name "piratekb-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "Žádné změny v data/, nic se necommituje."
            exit 0
          fi
          git commit -m "data: ${MODE} aktualizace ${DNES}"
          for pokus in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            echo "Push se nepodařil (pokus $pokus), zkouším znovu"
            sleep 10
          done
          exit 1

      - name: Vyhodnocení (červený běh při chybě zdroje)
        if: ${{ !cancelled() && steps.update.outputs.kod != '0' }}
        run: |
          echo "::error::scripts/update_data.sh skončil s kódem ${{ steps.update.outputs.kod }} (1 = selhal některý zdroj, 2 = validace nebo index). Podrobnosti jsou v logu a v data/AKTUALIZACE.md."
          exit 1
