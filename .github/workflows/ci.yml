# Kontrola dat a testů serveru na každém pull requestu a pushi do main.
# Poznámka: push z workflow "Aktualizace dat" tímto GITHUB_TOKENem další workflow nespouští;
# data si ten workflow hlídá sám (validate + build v update_data.sh).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            ingest/requirements.txt
            server/requirements.txt

      - name: Instalace závislostí
        run: pip install -r ingest/requirements.txt -r server/requirements.txt pytest

      - name: Kontrola dat (validate)
        run: python3 ingest/validate.py

      - name: Testy serveru
        run: python3 -m pytest server/tests -q

      # Kvalita odpovědí: 60 otázek z evals/otazky.yaml přímo nad tooly serveru (index se
      # postaví z data/). Pod prahem 85 % prošlých otázek CI selže; viz server/README.md.
      - name: Evals (kvalita odpovědí)
        run: python3 evals/run.py --prah 0.85

      - name: Výsledky evals jako artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evals-vysledky
          path: evals/vysledky.json
          if-no-files-found: ignore
