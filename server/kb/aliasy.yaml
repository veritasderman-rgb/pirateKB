# Aliasy a synonyma pro hledání ve znalostní bázi (server/kb).
#
# Ručně psaná část. Automatická část se generuje při buildu (server/kb/aliases.py)
# a obojí se uloží do tabulky `aliasy` v indexu:
#   - zkratka <-> název každé jednotky z data/lide/tymy a data/lide/regiony (pole `zkratka`),
#   - „Resortní tým X“ <-> „RT X“, „Meziresortní tým X“ <-> „MRT X“, „KS X“ <-> „Krajské
#     sdružení X“, „MS X“ <-> „Místní sdružení X“, „ZK X“ <-> „Zastupitelský klub X“,
#     „Pracovní skupina X“ <-> „PS X“, „Místní tým X“ <-> „MT X“,
#   - příjmení -> celé jméno u poslanců, europoslanců, senátorů a členů RP (jen pokud je
#     příjmení v evidenci jednoznačné) a domácké tvary křestních jmen (Kuba Michálek).
#
# Shoda se počítá na kmenech (server/kb/stem.py), takže stačí základní tvar:
# „Republikovým předsednictvem“ i „republikove predsednictvo“ najdou alias
# „Republikové předsednictvo“. Velikost písmen nehraje roli, s jednou výjimkou:
# zkratka, která je zároveň běžné české slovo (TO, PO, …), se rozvine jen když je
# v dotazu napsaná velkými písmeny.
#
# Sekce:
#   zkratky:  ZKRATKA: [význam, …]          oboustranně (RP <-> Republikové předsednictvo)
#   lide:     Celé jméno: [varianta, …]       jen varianta -> celé jméno
#   domacka_jmena: Křestní: [domácký tvar]  použije se automaticky na poslance a vedení
#   temata:   hlavní pojem: [synonymum, …]    hlavní pojem <-> každé synonymum
#             (synonyma se mezi sebou nerozvíjejí: „hypotéky“ najde „bydlení“, ne „nájmy“)

